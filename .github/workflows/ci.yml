name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dotnet:
    name: .NET (KGS)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore tests/Uworx.Khoji.Tests/Uworx.Khoji.Tests.csproj

    - name: Build
      run: dotnet build tests/Uworx.Khoji.Tests/Uworx.Khoji.Tests.csproj --no-restore --configuration Release

    - name: Test
      run: dotnet test tests/Uworx.Khoji.Tests/Uworx.Khoji.Tests.csproj --no-build --configuration Release --verbosity normal --filter "TestCategory=Unit" --collect:"XPlat Code Coverage"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v5
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  java:
    name: Java (KBS)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Test with Maven
      run: mvn test -B
      working-directory: src/khoji-business-server

  angular:
    name: Angular (Khoji Angular)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: yarn install --frozen-lockfile
      working-directory: src/khoji-angular

    - name: Test
      run: yarn workspace khoji-angular test
      working-directory: src/khoji-angular

  python:
    name: Python (Analytics)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r requirements.txt
      working-directory: src/khoji-analytics/backend

    - name: Test
      run: pytest
      working-directory: src/khoji-analytics/backend
