#spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
#spring.jpa.properties.hibernate.transaction.manager_lookup_class=org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
#logging.level.org.hibernate.stat=ERROR
#spring.jpa.properties.hibernate.cache.use_query_cache=false


################################################
# Job heartbeat
################################################
job.heartbeat.enabled=true


################################################
# Work Log configs (not used in code but fetched by environment.get())
################################################
other.worklog.percentage.threshold={"Normal":25,"Medium":50}
worklog.day.hour=8.0
worklog.other.categories.alias=Unproductive
worklog.main.categories.alias=Productive
worklogdistribution.json={}
others.worklog.email.subscription.threshold=25
worklog.percentage.threshold={\"Normal\":99.99,\"Medium\":75}
rag.color.codes={"GREEN":"#428A36","AMBER":"#E7BA1A","RED": "#B92A1C"}
worklog.rag.slider.config={"isRedStartingColor": true}
worklog.data.storage.permission=true
worklog.data.sync.permission=false
include.weekends.in.worklog.stats=false

##############################################
# Sprint Analytics Configs
##############################################
sync.payload={\"job_type\":\"recent_activity_issues\",\"parameters\":{\"jql\":\"updated >= -7d\",\"sprint_states\":[\"active\"],\"include_comments\":true,\"include_changelog\":true,\"include_subtasks\":true},\"priority\":10,\"created_by\":\"\"}
proactive.sync.parameters={\"job_type\":\"proactive_sprints_sync\",\"parameters\":{\"jql\":\"updated >= -7d\",\"sprint_status\":\"active\",\"include_comments\":true,\"include_changelog\":true,\"include_subtasks\":true},\"priority\":10,\"created_by\":\"\"}
sprints.list.sync.parameters={\"job_type\":\"sprints_list_sync\",\"parameters\":{\"sprint_states\":[\"active\", \"closed\"]},\"priority\":10,\"created_by\":\"orchestrator\"}
# This has to stay empty here, see proactive sync docs for more info
sprint.analytics.target.sprint.id=

