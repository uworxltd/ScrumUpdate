############################################################################
# This property file has all the properties which are required on
# startup/boot of application (Tools/Technologies properties).
# Please make sure while adding any new property, proper comments should be
# added and also to maintain descending order.
############################################################################

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=khoji
#logging.level.liquibase=DEBUG          # Enable this if detailed DEBUG logs are to be viewed

################################################
# Khoji Server
################################################
server.address=0.0.0.0
server.port=4243
spring.application.name=khoji_agile_server
spring.api.compression=disabled
version=cloud-1.3.7
feature.flag={\"filters-caching\":false,\"burnup-filters-caching\":false,\"sub-task-distribution\":false,\"dashboard-insights\":false}
khoji-healthcheck.json={\n  \"pushEnabled\": false,\n  \"pushFrequencyInSeconds\": 120,\n  \"vmSubDomain\": \"app.scrumupdate.com\",\n  \"pluginBaseUrl\": \"localhost\",\n  \"monitorPushUrl\": \"https://dummyurl.com/yfuh232\",\n  \"healthCheckExclusions\": [\"jiraPlugin\"]\n}


################################################
# Spring Core
################################################
# possible options dev, prod
spring.profiles.active=${PROFILE:dev}
jms.email.queue=direct:khojiEmailQueue
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=800MB
camel.main.name=KhojiEmailCamelRoute
camel.main.jmx-enabled=true
spring.main.allow-bean-definition-overriding=true
spring.banner.location=classpath:banner.txt
java.awt.headless=false

#FOR CONFIG SERVER
#spring.cloud.config.enabled=true
#spring.cloud.compatibility-verifier.enabled=false
management.endpoints.web.exposure.include=*


# off and try
spring.main.allow-circular-references=true


################################################
# Spring JPA/Database
################################################
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.id.db_structure_naming_strategy=standard


################################################
# Spring hibernate caching
################################################
## Enable @Cacheable annotation
#spring.jpa.properties.javax.persistence.sharedCache.mode=ENABLE_SELECTIVE
#spring.jpa.properties.hibernate.cache.use_second_level_cache=false
#spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.ehcache.SingletonEhCacheRegionFactory
#spring.cache.ehcache.config=classpath:ehcache.xml
