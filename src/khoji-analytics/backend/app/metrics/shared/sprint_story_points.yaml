name: sprint_story_points
description: |
  Returns total and resolved story points for a sprint.
version: 1.0

inputs:
  sprint_id: { type: int, default: 1 }

steps:
  - id: story_points_query
    type: sql
    service: main-db
    query: |
      WITH sprint_story_points AS (
        SELECT 
          si.sprint_id,
          COALESCE(SUM(i.story_points), 0)::numeric(10,2) AS total_story_points,
          COALESCE(SUM(CASE WHEN i.status_category = 'Done' THEN i.story_points ELSE 0 END), 0)::numeric(10,2) AS resolved_story_points
        FROM {{ schema }}.sprint_issues si
        INNER JOIN {{ schema }}.issues i ON si.issue_key = i.issue_key
        WHERE si.sprint_id = $1::int
        GROUP BY si.sprint_id
      )
      SELECT * FROM sprint_story_points
    params:
      - "{{ inputs.sprint_id }}"
    output: { name: story_points_data }

return: "story_points_query.story_points_data"
