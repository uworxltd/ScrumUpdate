name: stagnant_tasks
description: Tasks stagnant in In Progress, QA, or Review status
version: 1.0

inputs:
  sprint_id: { type: int, required: true }

steps:
  - id: stagnant_query
    type: sql
    service: main-db
    query: |
      WITH last_status_change AS (
          SELECT
              i.issue_key,
              MAX(c.created_date) AS last_status_change_at
          FROM issues i
          JOIN changelogs c
            ON c.issue_key = i.issue_id
           AND c.field_name = 'status'
          GROUP BY i.issue_key
      ),

      last_comment AS (
          SELECT
              issue_key,
              MAX(created_date) AS last_comment_at
          FROM comments
          GROUP BY issue_key
      ),

      effective_activity AS (
          SELECT
              i.issue_key,
              GREATEST(
                  COALESCE(lsc.last_status_change_at, i.created_date),
                  COALESCE(lc.last_comment_at, i.created_date)
              ) AS last_activity_at,
              i.story_points
          FROM issues i
          LEFT JOIN last_status_change lsc
              ON lsc.issue_key = i.issue_key
          LEFT JOIN last_comment lc
              ON lc.issue_key = i.issue_key
      ),

      activity_age AS (
          SELECT
              ea.issue_key,
              ea.story_points,
              FLOOR(
                  EXTRACT(EPOCH FROM (NOW() - ea.last_activity_at)) / 86400
              )::int AS age_days
          FROM effective_activity ea
      )

      SELECT
          i.issue_key,
          i.summary AS title,
          i.assignee_display_name AS assignee,
          i.status AS current_status,
          aa.age_days,
          i.story_points,
          i.priority
      FROM issues i
      JOIN sprint_issues si
          ON si.issue_key = i.issue_key
      JOIN activity_age aa
          ON aa.issue_key = i.issue_key
      WHERE si.sprint_id = $1
        AND i.status_category <> 'Done'
        AND LOWER(i.status) IN (
            'in progress',
            'in qa',
            'qa',
            'awaiting qa',
            'in review'
        )
        AND (
            (
                aa.story_points IS NOT NULL
                AND aa.age_days > (aa.story_points + 1)
            )
            OR
            (
                aa.story_points IS NULL
                AND aa.age_days > 4
            )
        )
      ORDER BY aa.age_days DESC
    params:
      - "{{ inputs.sprint_id }}"
    output: { name: stagnant_issues }

return: stagnant_query.stagnant_issues
