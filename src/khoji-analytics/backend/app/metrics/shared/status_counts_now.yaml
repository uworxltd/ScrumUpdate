name: status_counts_now
description: |
  Shared metric: Retrieves current status counts for issues in a sprint.
  Returns counts of issues in each status category (To Do, In Progress, Done)
  as they are right now.
  
  Queries base tables directly (sprint_issues + issues).
  This is a base/shared metric used by higher-level metrics to reduce duplication.
version: 1.0

inputs:
  sprint_id: { type: int, default: 1 }

steps:
  - id: current_status_counts
    type: sql
    service: main-db
    query: |
      SELECT
        COUNT(*) FILTER (WHERE i.status_category = 'To Do') AS cnt_to_do,
        COUNT(*) FILTER (WHERE i.status_category = 'In Progress') AS cnt_in_progress,
        COUNT(*) FILTER (WHERE i.status_category = 'Done') AS cnt_done
      FROM {{ schema }}.sprint_issues si
      INNER JOIN {{ schema }}.issues i ON si.issue_key = i.issue_key
      WHERE si.sprint_id = $1::int
    params:
      - "{{ inputs.sprint_id }}"
    output: { name: current_counts }

return: "current_status_counts.current_counts"
