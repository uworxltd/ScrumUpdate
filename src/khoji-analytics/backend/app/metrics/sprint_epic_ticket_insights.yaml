name: ticket_insights
description: Get AI-powered insights for a specific ticket including timeline analysis
version: 1.0

inputs:
  issue_key: { type: string, required: true }

steps:
  - id: get_ticket_data
    type: sql
    service: main-db
    query: |
      WITH issue_base AS (
        SELECT issue_id, issue_key, summary, description, parent_issue_key,
               story_points, status AS current_status, priority
        FROM {{ schema }}.issues
        WHERE issue_key = $1
      ),

      latest_status AS (
        SELECT COALESCE(
          (SELECT c.created_date
           FROM {{ schema }}.changelogs c
           WHERE c.issue_key = (SELECT issue_id FROM issue_base)
             AND c.field_name = 'status'
           ORDER BY c.created_date DESC
           LIMIT 1),
          (SELECT created_date FROM {{ schema }}.issues WHERE issue_id = (SELECT issue_id FROM issue_base))
        ) AS created_date
      ),

      timeline_data AS (
        SELECT
          i.issue_key,
          i.issue_id,
          i.summary,
          i.description,
          i.parent_issue_key,
          i.story_points,
          i.current_status,
          i.priority,
          (SELECT created_date FROM latest_status) AS last_status_change,
          ROUND(EXTRACT(EPOCH FROM (NOW() - (SELECT created_date FROM latest_status))) / 86400::numeric, 2) AS days_in_status,

          (
            SELECT COALESCE(
              jsonb_agg(event ORDER BY (event->>'event_date')::timestamptz DESC),
              '[]'::jsonb
            )
            FROM (
              SELECT jsonb_build_object(
                'days_ago', EXTRACT(EPOCH FROM (NOW() - c.created_date)) / 86400,
                'event_type', c.field_name,
                'from_value', c.from_display_value,
                'to_value', c.to_display_value,
                'author', c.author_display_name,
                'event_date', c.created_date
              ) AS event
              FROM {{ schema }}.changelogs c
              WHERE c.issue_key = i.issue_id
                AND c.field_name IN ('status', 'Sprint', 'assignee', 'priority')
              ORDER BY c.created_date DESC
              LIMIT 4
            ) AS all_events
          ) AS timeline

        FROM issue_base i
      )
      SELECT * FROM timeline_data;

    params:
      - "{{ inputs.issue_key }}"
    output: { name: ticket_data }

  - id: llm_ticket_insights
    type: http_ai
    service: llm
    headers:
      Content-Type: "application/json"
    body:
      instance: "{{ tenant_id }}"
      llm: "claude-haiku"
      prompt: "TicketInsights"
      data: "{{ steps.get_ticket_data.outputs.ticket_data }}"
    cache: 8640000 # Cache for 24x100 hours
    output: { name: llm_response }

  - id: parse_insights
    type: function
    function: app.processors.llm.extract_reply_json
    inputs:
      response: "{{ steps.llm_ticket_insights.outputs.llm_response }}"
    cache: 8640000 # Cache for 24x100 hours
    output: { name: parsed_insights }

  - id: merge_data
    type: function
    function: app.processors.sprint_cards.merge_ticket_with_insights
    inputs:
      ticket_data: "{{ steps.get_ticket_data.outputs.ticket_data }}"
      ai_insights: "{{ steps.parse_insights.outputs.parsed_insights }}"
    output: { name: final_data }

return: merge_data.final_data
