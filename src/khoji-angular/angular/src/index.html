<!DOCTYPE html>
<html lang="en">

<head>
  <!-- <link id="theme-link" rel="stylesheet" type="text/css" href="assets/layout/styles/theme/theme-dark/indigo/theme.css"> -->

  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Scrum Update</title>
  <link rel="shortcut icon" href="assets/images/khoji-tab-logo.ico" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <style>
    .td-truncate {
      -webkit-box-orient: vertical;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="assets/layout/styles/layout/preloading.css">
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css?family=Nunito" />
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css?family=Poppins" />
  <script src="assets/env.js"></script>
  <script src="assets/loader.min.js"></script>
</head>

<body>
  <app-root>
    <div class="px-5 min-h-screen flex justify-content-center align-items-center flex-column">
      <div class="border-1 surface-border surface-card border-round py-2 px-4 md:px-7 z-1">
        <div class="flex justify-content-center align-items-center"><img
            src="assets/images/scrumupdate-logo-v1.svg" alt="ScrumUpdate" width="160"
            height="140" class="mt-4"></div><!---->
        <div novalidate="" class="ng-untouched ng-pristine ng-valid ng-star-inserted">
          <div class="flex flex-column"><!---->
            <div class="mt-4 ng-star-inserted"><span class="p-input-icon-left w-full text-center white-space-normal text-2xl"> Automated Scrum Updates that
                keep everyone aligned. </span></div><!----><!----><!----><!---->
          </div>
        </div><!----><!---->
        <div class="flex justify-content-center mt-4"><i class="font-bold pi pi-spin pi-spinner text-3xl"></i></div>
        <footer data-test="copyright-text"
          class="flex justify-content-center align-items-center m-4 text-900">hello@scrumupdate.com</footer>
      </div>
    </div>
  </app-root>
</body>

</html>
