<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="560" height="310" rx="14" fill="#f3f4f8"/>

  <!-- === TOP ROW: Three KPI cards === -->

  <!-- Card 1: Team Members -->
  <rect x="16" y="16" width="164" height="90" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Icon -->
  <rect x="141" y="26" width="30" height="30" rx="8" fill="#e8f0fe"/>
  <text x="156" y="47" text-anchor="middle" font-size="16" fill="#4a6cf7">&#128101;</text>
  <!-- Label -->
  <text x="30" y="42" font-size="10" fill="#7a7f99" font-weight="500">Team Members</text>
  <!-- Value -->
  <text x="30" y="66" font-size="26" font-weight="700" fill="#2c2f48">1</text>
  <!-- Subtitle -->
  <text x="30" y="92" font-size="9" fill="#aab0c5">0 updates received</text>
  <!-- Highlight border -->
  <rect x="16" y="16" width="164" height="90" rx="10" fill="none" stroke="#4a6cf7" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Card 2: Completion Rate -->
  <rect x="196" y="16" width="164" height="90" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Icon -->
  <rect x="321" y="26" width="30" height="30" rx="8" fill="#fff8e1"/>
  <text x="336" y="47" text-anchor="middle" font-size="16" fill="#e6a817">&#128202;</text>
  <!-- Label -->
  <text x="210" y="42" font-size="10" fill="#7a7f99" font-weight="500">Completion Rate</text>
  <!-- Value -->
  <text x="210" y="66" font-size="26" font-weight="700" fill="#2c2f48">0%</text>
  <!-- Subtitle -->
  <text x="210" y="92" font-size="9" fill="#aab0c5">1 pending updates</text>
  <!-- Highlight border -->
  <rect x="196" y="16" width="164" height="90" rx="10" fill="none" stroke="#e6a817" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Card 3: Active Blockers -->
  <rect x="376" y="16" width="168" height="90" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <!-- Icon -->
  <rect x="503" y="26" width="30" height="30" rx="8" fill="#e6faf1"/>
  <text x="518" y="47" text-anchor="middle" font-size="16" fill="#27a060">&#9432;</text>
  <!-- Label -->
  <text x="390" y="42" font-size="10" fill="#7a7f99" font-weight="500">Active Blockers</text>
  <!-- Value -->
  <text x="390" y="66" font-size="26" font-weight="700" fill="#2c2f48">0</text>
  <!-- Subtitle -->
  <text x="390" y="92" font-size="9" fill="#27a060" font-weight="500">Smooth sailing</text>
  <!-- Highlight border -->
  <rect x="376" y="16" width="168" height="90" rx="10" fill="none" stroke="#27a060" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.4"/>

  <!-- Labels under KPI cards -->
  <rect x="42" y="112" width="112" height="18" rx="5" fill="#eef1ff"/>
  <text x="98" y="125" text-anchor="middle" font-size="8" fill="#4a6cf7" font-weight="600">Member Participation</text>

  <rect x="220" y="112" width="116" height="18" rx="5" fill="#fff8e1"/>
  <text x="278" y="125" text-anchor="middle" font-size="8" fill="#c89a00" font-weight="600">Update Completion</text>

  <rect x="399" y="112" width="122" height="18" rx="5" fill="#edfff4"/>
  <text x="460" y="125" text-anchor="middle" font-size="8" fill="#27a060" font-weight="600">Blocker Visibility</text>

  <!-- === BOTTOM: Team Updates Feed === -->
  <rect x="16" y="142" width="528" height="128" rx="10" fill="#ffffff" filter="url(#shadow)" stroke-dasharray="6,4" stroke="#c8cce0" stroke-width="1"/>

  <!-- Dashed inner border to indicate "feed area" -->
  <rect x="28" y="152" width="504" height="108" rx="7" fill="none" stroke="#dde0ef" stroke-width="1" stroke-dasharray="5,4"/>

  <!-- Empty state icon (inbox/mail) -->
  <g transform="translate(256, 172)">
    <!-- envelope body -->
    <rect x="-22" y="0" width="44" height="30" rx="4" fill="none" stroke="#c8cce0" stroke-width="2"/>
    <!-- envelope flap -->
    <polyline points="-22,0 0,16 22,0" fill="none" stroke="#c8cce0" stroke-width="2"/>
  </g>

  <text x="280" y="226" text-anchor="middle" font-size="10" fill="#aab0c5">No updates submitted yet for this selection.</text>

  <!-- Feed label -->
  <rect x="190" y="256" width="180" height="18" rx="5" fill="#eef1ff"/>
  <text x="280" y="269" text-anchor="middle" font-size="8" fill="#4a6cf7" font-weight="600">Team Updates Feed</text>

  <!-- Bottom highlight strip -->
  <rect x="16" y="280" width="528" height="22" rx="6" fill="#4a6cf7" opacity="0.07"/>
  <text x="90" y="295" text-anchor="middle" font-size="8" fill="#4a6cf7" font-weight="600">&#128101; Team Participation</text>
  <text x="240" y="295" text-anchor="middle" font-size="8" fill="#4a6cf7" font-weight="600">&#128202; Completion Tracking</text>
  <text x="390" y="295" text-anchor="middle" font-size="8" fill="#4a6cf7" font-weight="600">&#128683; Blocker Detection</text>
  <text x="510" y="295" text-anchor="middle" font-size="8" fill="#4a6cf7" font-weight="600">&#128233; Update Feed</text>

  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c0c4d8" flood-opacity="0.16"/>
    </filter>
  </defs>
</svg>
