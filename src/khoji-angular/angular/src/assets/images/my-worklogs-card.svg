<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bgGrad)" rx="12"/>
  <!-- calendar icon -->
  <g transform="translate(20,20)">
    <rect x="10" y="10" width="80" height="60" fill="#fff" rx="6"/>
    <line x1="10" y1="30" x2="90" y2="30" stroke="#4facfe" stroke-width="3"/>
    <circle cx="30" cy="50" r="6" fill="#4facfe"/>
    <circle cx="50" cy="50" r="6" fill="#4facfe"/>
    <circle cx="70" cy="50" r="6" fill="#4facfe"/>
  </g>
  <!-- clock -->
  <circle cx="350" cy="60" r="30" fill="#fff" />
  <line x1="350" y1="60" x2="350" y2="45" stroke="#4facfe" stroke-width="3"/>
  <line x1="350" y1="60" x2="365" y2="60" stroke="#4facfe" stroke-width="3"/>
  <!-- title and text -->
  <text x="140" y="60" font-family="Arial" font-size="24" fill="#fff">My Worklogs</text>
  <text x="140" y="90" font-family="Arial" font-size="14" fill="#fff">Auto worklog generation</text>
  <text x="140" y="110" font-family="Arial" font-size="12" fill="#fff">with AI suggestions</text>
</svg>