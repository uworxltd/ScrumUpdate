<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="560" height="320" rx="14" fill="#f3f4f8"/>

  <!-- Left card: Team Sprint Metrics -->
  <rect x="16" y="16" width="240" height="288" rx="10" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Team name header area (blurred placeholder) -->
  <rect x="32" y="30" width="120" height="12" rx="6" fill="#e2e5ee"/>
  <rect x="32" y="50" width="190" height="8" rx="4" fill="#ebedf5"/>
  <rect x="32" y="64" width="160" height="8" rx="4" fill="#ebedf5"/>
  <rect x="32" y="78" width="130" height="8" rx="4" fill="#ebedf5"/>

  <!-- Divider -->
  <line x1="32" y1="100" x2="240" y2="100" stroke="#f0f0f5" stroke-width="1"/>

  <!-- Metrics row: Story Points -->
  <rect x="32" y="112" width="60" height="56" rx="8" fill="#fff0f0"/>
  <text x="62" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#e05555">6/18</text>
  <text x="62" y="154" text-anchor="middle" font-size="9" fill="#e05555">Story Points</text>

  <!-- Scope Change -->
  <rect x="102" y="112" width="60" height="56" rx="8" fill="#fffbe6"/>
  <text x="132" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#c89a00">50%</text>
  <text x="132" y="154" text-anchor="middle" font-size="9" fill="#c89a00">Scope Change</text>

  <!-- Ticket Hygiene -->
  <rect x="172" y="112" width="60" height="56" rx="8" fill="#edfff4"/>
  <text x="202" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#27a060">66%</text>
  <text x="202" y="154" text-anchor="middle" font-size="9" fill="#27a060">Ticket Hygiene</text>

  <!-- Sprint Progress -->
  <text x="32" y="190" font-size="10" fill="#7a7f99">Sprint Progress</text>
  <rect x="32" y="196" width="180" height="8" rx="4" fill="#e3e7ef"/>
  <rect x="32" y="196" width="115" height="8" rx="4" fill="#4a6cf7"/>
  <text x="155" y="206" font-size="8" fill="#4a6cf7" font-weight="600">63.8%</text>
  <text x="32" y="222" font-size="8" fill="#aab0c5">Sprint ends on: Mar 16, 2026</text>

  <!-- Highlight border for left card -->
  <rect x="16" y="16" width="240" height="288" rx="10" fill="none" stroke="#4a6cf7" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.45"/>
  <!-- Label -->
  <rect x="28" y="244" width="150" height="20" rx="5" fill="#eef1ff"/>
  <text x="103" y="258" text-anchor="middle" font-size="9" fill="#4a6cf7" font-weight="600">Sprint &amp; Team Metrics</text>

  <!-- Right card: Status Changes -->
  <rect x="272" y="16" width="272" height="288" rx="10" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="408" y="44" text-anchor="middle" font-size="12" font-weight="700" fill="#2c2f48">Status Changes (Yesterday → Today)</text>

  <!-- Badge row -->
  <rect x="292" y="54" width="100" height="20" rx="10" fill="#e6f4ea"/>
  <text x="342" y="68" text-anchor="middle" font-size="9" fill="#27a060" font-weight="600">+12 Progressed</text>
  <rect x="402" y="54" width="68" height="20" rx="10" fill="#e8eeff"/>
  <text x="436" y="68" text-anchor="middle" font-size="9" fill="#4a6cf7" font-weight="600">Net: +12</text>

  <!-- To Do box -->
  <rect x="292" y="84" width="72" height="72" rx="8" fill="#fff5f5"/>
  <text x="328" y="115" text-anchor="middle" font-size="22" font-weight="800" fill="#e05555">-7</text>
  <text x="328" y="130" text-anchor="middle" font-size="8" fill="#aab0c5">(13 → 6)</text>
  <text x="328" y="146" text-anchor="middle" font-size="9" fill="#7a7f99">To Do</text>

  <!-- In Progress box -->
  <rect x="372" y="84" width="72" height="72" rx="8" fill="#f6f7fb"/>
  <text x="408" y="115" text-anchor="middle" font-size="22" font-weight="800" fill="#2c2f48">0</text>
  <text x="408" y="130" text-anchor="middle" font-size="8" fill="#aab0c5">(13 → 13)</text>
  <text x="408" y="146" text-anchor="middle" font-size="9" fill="#7a7f99">In Progress</text>

  <!-- Done box -->
  <rect x="452" y="84" width="72" height="72" rx="8" fill="#f0faf5"/>
  <text x="488" y="115" text-anchor="middle" font-size="22" font-weight="800" fill="#27a060">+7</text>
  <text x="488" y="130" text-anchor="middle" font-size="8" fill="#aab0c5">(3 → 10)</text>
  <text x="488" y="146" text-anchor="middle" font-size="9" fill="#7a7f99">Done</text>

  <!-- Carousel dots -->
  <circle cx="368" cy="175" r="5" fill="#4a6cf7"/>
  <circle cx="383" cy="175" r="4" fill="#d5d9ef"/>
  <circle cx="396" cy="175" r="4" fill="#d5d9ef"/>
  <circle cx="409" cy="175" r="4" fill="#d5d9ef"/>
  <circle cx="422" cy="175" r="4" fill="#d5d9ef"/>

  <!-- Nav arrows -->
  <circle cx="292" cy="174" r="12" fill="#f0f2fa"/>
  <text x="292" y="179" text-anchor="middle" font-size="12" fill="#7a7f99">‹</text>
  <circle cx="524" cy="174" r="12" fill="#f0f2fa"/>
  <text x="524" y="179" text-anchor="middle" font-size="12" fill="#7a7f99">›</text>

  <!-- Highlight border for right card -->
  <rect x="272" y="16" width="272" height="288" rx="10" fill="none" stroke="#27a060" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.45"/>
  <!-- Label -->
  <rect x="310" y="244" width="190" height="20" rx="5" fill="#edfff4"/>
  <text x="405" y="258" text-anchor="middle" font-size="9" fill="#27a060" font-weight="600">Daily Status Transition Insights</text>

  <!-- Bottom strip: feature highlights -->
  <rect x="16" y="280" width="528" height="24" rx="6" fill="#4a6cf7" opacity="0.08"/>
  <text x="60" y="296" text-anchor="middle" font-size="9" fill="#4a6cf7" font-weight="600">🚦 Real-time Updates</text>
  <text x="200" y="296" text-anchor="middle" font-size="9" fill="#4a6cf7" font-weight="600">👥 Team Collaboration</text>
  <text x="360" y="296" text-anchor="middle" font-size="9" fill="#4a6cf7" font-weight="600">📊 Sprint Progress Tracking</text>
  <text x="500" y="296" text-anchor="middle" font-size="9" fill="#4a6cf7" font-weight="600">🔄 Status Transitions</text>

  <!-- Drop shadow filter -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#c0c4d8" flood-opacity="0.18"/>
    </filter>
  </defs>
</svg>
