<div class="text-lg ml-2">
  {{ ticketWorklogData.ticketId }}
</div>

<p-tabView
  [scrollable]="true"
  [(activeIndex)]="tabActiveIndex"
>
  <ng-container *ngFor="let worklogItem of ticketWorklogData.workLogItems; let index = index">
    <p-tabPanel
      *ngIf="worklogItem.workLogId"
      class="shadow-none"
    >
      <ng-template pTemplate="header">
        <div class="white-space-nowrap">Card {{ index + 1 }}</div>
      </ng-template>

      <ng-template pTemplate="content">
        <ng-container *ngTemplateOutlet="worklogTemplate; context: { worklogItem: worklogItem }"></ng-container>
      </ng-template>
    </p-tabPanel>

    <p-tabPanel
      class="shadow-none"
      *ngIf="worklogItem.newWorklog"
    >
      <ng-template pTemplate="header">
        <div
          (click)="addNewEntry()"
          class="white-space-nowrap mr-3"
        >
          <span>+ New card</span>
        </div>
      </ng-template>

      <ng-template pTemplate="content">
        <ng-container *ngTemplateOutlet="worklogTemplate; context: { worklogItem: worklogItem }"></ng-container>
      </ng-template>
    </p-tabPanel>
  </ng-container>
</p-tabView>

<ng-template
  #worklogTemplate
  let-worklogItem="worklogItem"
>
  <div class="mt-3">
    <div>
      <p-inputNumber
        class="hours-input"
        inputId="inputnumber"
        mode="decimal"
        [(ngModel)]="worklogItem.timeSpentInHours"
        placeholder="Time spent (h)"
        min="0"
        [step]="0.1"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
      >
      </p-inputNumber>
      <span class="ml-1">hour{{worklogItem?.timeSpentInHours===1?'':'s'}}</span>
    </div>

    <div class="mt-3">
      <textarea
        pInputTextarea
        placeholder="Work log description (optional)"
        inputId="textarea"
        [(ngModel)]="worklogItem.description"
        class="w-full"
        rows="3"
        cols="30"
      >
      </textarea>
    </div>

    <div class="flex justify-content-end">
      <button
        pButton
        pRipple
        icon="fa fa-check"
        class="p-button-text p-button-success ml-2"
        [disabled]="worklogItem.timeSpentInHours === null || isAnyCallLoading() || newWorkLogLoadingState == 1"
        (click)="updateWorklog(worklogItem, ticketWorklogData.ticketId, ticketWorklogData.ticketDescription, worklogItem.newWorklog)"
      ></button>
      <button
        *ngIf="worklogItem.workLogId"
        pButton
        pRipple
        type="button"
        icon="pi pi-trash"
        class="p-button-text p-button-danger"
        [disabled]="isAnyCallLoading()"
        (click)="deleteWorklog(worklogItem.workLogId, ticketWorklogData.ticketId)"
      ></button>
    </div>
  </div>
</ng-template>
