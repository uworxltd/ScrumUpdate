<div class="w-full h-full flex flex-column overflow-hidden">
  <!-- Header Section - Always Visible -->
  <div class="flex justify-content-between align-items-center p-2 pb-0 -mt-2">
    <h3 class="text-xl font-bold text-color m-0">{{ 'Team Work Progress' }}</h3>
    <div *ngIf="hasData" class="flex align-items-center gap-3">
      <div class="text-2xl font-bold text-green-700">{{ teamPulseData?.pulseScore || 0 }}%</div>
      <div class="flex align-items-center text-sm gap-1 cursor-pointer" *ngIf="teamPulseData?.pulseChange !== null && teamPulseData?.pulseChange !== undefined" [ngClass]="pulseChangeClass"
        pTooltip="Daily change in team work progress."
        tooltipPosition="top"
        appendTo="body">
        <i [class]="'pi ' + pulseChangeIcon + ' font-bold text-base'"></i>
        <span class="font-semibold">{{ teamPulseData.pulseChange }}%</span>
      </div>
    </div>
  </div>

  <!-- Default State: No Data Available -->
  <div *ngIf="!hasData" class="flex flex-column flex-1 align-items-center justify-content-center p-4 text-center">
    <i class="pi pi-users text-6xl text-400 mb-3"></i>
    <h3 class="text-xl text-600 m-0 mb-2">No Workload Data Available</h3>
    <p class="text-500 m-0">{{ missingDataReason }}</p>
  </div>

  <!-- Data State: Show Team Pulse -->
  <div *ngIf="hasData" class="flex flex-column flex-1 overflow-hidden p-2 pt-0">
    <!-- Members Section -->
    <div class="flex-1 flex flex-column overflow-hidden min-h-0 mt-3">
      <!-- <h4 class="text-lg font-semibold text-color mt-2 mb-0">Members</h4> -->
      
      <div class="flex-1 overflow-y-auto overflow-x-hidden pr-2 min-h-0">
        <div class="flex flex-column gap-2">
          <div class="flex flex-column flex-shrink-0 gap-2" *ngFor="let member of members">
            <!-- Member Header (Avatar + Name + Percentage) -->
              <div class="flex align-items-center justify-content-between gap-2">
                <div class="flex align-items-center flex-1 gap-2 min-w-0">
                  <div class="member-avatar flex align-items-center justify-content-center flex-shrink-0 surface-200 border-circle overflow-hidden">
                    <img *ngIf="member.avatar" [src]="member.avatar" [alt]="member.name" class="w-full h-full member-avatar-img" />
                    <div *ngIf="!member.avatar" class="text-xs font-bold text-color-secondary">
                      {{ member.initials }}
                    </div>
                  </div>
                  <div class="flex flex-column flex-1 min-w-0">
                    <div class="flex align-items-center gap-2">
                      <span class="">{{ member.name }}</span>
                      <p-chip [label]="member.points + '/' + member.committedPoints + ' pts'" styleClass="points-chip"></p-chip>
                    </div>
                  </div>
                </div>
                <div class="font-bold" [ngStyle]="{'color': member.percentageColor}">
                  {{ member.percentage }}%
                </div>
              </div>
            <!-- Progress Bar -->
            <div class="progress-bar-container">
              <div class="w-full surface-200 border-round progress-bar-bg">
                <div class="h-full border-round-left progress-bar-fill" 
                  [style.width.%]="member.percentage">
                </div>
                <div class="absolute bg-white border-circle progress-marker" 
                  [style.left.%]="member.percentage"
                  [ngStyle]="{'border-color': member.percentageColor}"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
