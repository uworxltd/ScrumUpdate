<div class="layout-topbar" style="height:35px;">
    <div class="topbar-start">
        <button #menubutton type="button" class="topbar-menubutton p-link p-trigger" (click)="onMenuButtonClick()">
            <i class="pi pi-bars"></i>
        </button>

        <app-breadcrumb class="topbar-breadcrumb" [ngClass]="{'z-2 fixed': isAdminPage}"></app-breadcrumb>
    </div>

    <div class="topbar-end profile-toggle-topbar">
        <ul class="topbar-menu">
            <!-- Top bar search. Remove d-none to make visible -->
            <li class="topbar-search d-none">
                <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input type="text" pInputText placeholder="Search" class="w-12rem sm:w-full">
                </span>
            </li>
            <!-- TODO: remove confidential information from the help page -->
            <!-- <li class="help-link-container-topbar">
                <span>
                    <a class="text-primary" target="_blank" href="{{helpPageUrl}}">{{translation?.signupUser?.signupPage?.needHelp}}</a>
                </span>
            </li> -->
            <li class="topbar-profile">
                <button type="button" class="p-link" (click)="onProfileButtonClick()">
                    <div *ngIf="!base64ImageUrl" id="initials">{{initials}}</div>
                    <img *ngIf="base64ImageUrl" class="border-circle" src="{{base64ImageUrl}}" alt="{{firstName}}" />
                </button>
            </li>
        </ul>
    </div>
</div>
