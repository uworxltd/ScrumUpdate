<div class="layout-container" style="background-color:white" [ngClass]="containerClass">
    <app-sidebar></app-sidebar>
    <div class="layout-content-wrapper flex flex-column">
        <app-topbar></app-topbar>

        <div class="layout-content w-full flex gap-3" *ngIf="getFeature() as feature">
            <app-leftbar [featureId]="featureId"></app-leftbar>
            <div class="flex-1 scrollable-content-area main-content-area pr-3">
                <router-outlet style="display:none"></router-outlet>
                <!--div>
                    teamViewFeaturesEnabled: {{teamViewFeaturesEnabled}}<br>
                    myWorkFeaturesEnabled: {{myWorkFeaturesEnabled}}<br>
                    feature: {{feature}}<br>
                    scrumAssistantFeatureEnabled: {{scrumAssistantFeatureEnabled}}<br>
                    logMyWorkSelectedTab: {{logMyWorkSelectedTab}}<br>
                    featureId: {{featureId}}
                </div-->
            </div>
            <ng-container
                *ngIf="(feature === 'team-view' && scrumAssistantFeatureEnabled) || (feature === 'my-work' && logMyWorkSelectedTab === 'MyWorklogs/Tab' && myWorklogFeatureEnabled) || (featureId !== 0 && feature === 'my-work' && teamViewFeaturesEnabled?.length) || (featureId !== 0 && feature === 'team-view' && myWorkFeaturesEnabled?.length)">
                <div class="sidebar-indicator-right" [ngClass]="{'p-collapsed-right': !isRightbarExpanded}">
                    <i class="arrow-icon-right pi"
                        [ngClass]="{ 'pi-angle-right': isRightbarExpanded, 'pi-angle-left': !isRightbarExpanded }"
                        data-test="collapse-icon-right" aria-label="Toggle right panel"
                        (click)="toggleRightbar($event)"></i>
                </div>

                <!-- CHANGED: add 'right-panel' as a CLASS and a template ref '#rightPanel' -->
                <div #rightPanel style="width:300px;" class="scrollable-content-area pt-5 right-panel"
                    [style.width.px]="isRightbarExpanded ? 300 : 0">
                    <div *ngIf="feature === 'team-view' && scrumAssistantFeatureEnabled">
                        <khoji-chat></khoji-chat>
                    </div>
                    <khoji-weekly-worklog-summary
                        *ngIf="feature === 'my-work' && logMyWorkSelectedTab === 'MyWorklogs/Tab' && myWorklogFeatureEnabled"></khoji-weekly-worklog-summary>
                    <div class="mt-3" *ngIf="(featureId !== 0 && feature === 'my-work' && teamViewFeaturesEnabled?.length) || (featureId !== 0 && feature === 'team-view' && myWorkFeaturesEnabled?.length)">
                        <khoji-feature-unlock></khoji-feature-unlock>
                    </div>
                </div>
            </ng-container>
            <div><!--for spaceing --></div>
        </div>
    </div>
    <app-profilemenu class="absolute top-0 right-0 h-full"></app-profilemenu>
    <app-config [hidden]="!showAppConfigPanel"></app-config>
    <div class="layout-mask"></div>
</div>
