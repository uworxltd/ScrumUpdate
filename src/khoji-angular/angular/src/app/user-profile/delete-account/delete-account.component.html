<p-dialog
  [(visible)]="openDialog"
  [modal]="isModal"
  [style]="{ width: '50vw' }"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
>
  <ng-template pTemplate="header">
    <h4 class="khoji-headings-title">{{ translation?.userProfile.deleteAccount.title }}</h4>
  </ng-template>
  <div class="mx-4">
    <!-- Warning Alert Section -->
    <div class="warning-alert">
      <div class="warning-icon">
        <i class="pi pi-exclamation-triangle"></i>
      </div>
      <div class="warning-content">
        <h5 class="warning-title">{{ translation?.userProfile.deleteAccount.warningTitle }}</h5>
        <p class="warning-message">{{ translation?.userProfile.deleteAccount.warningMessage }}</p>
      </div>
    </div>
  </div>
  <div
    *ngIf="reasons"
    class="mx-4 mt-4"
  >
    <h5 class="khoji-sub-headings">{{ translation?.userProfile.deleteAccount.reasonQuestion }}</h5>
    <div
      *ngFor="let reason of reasons; let id = index; let last = last"
      class="field-radiobutton"
    >
      <p-radioButton
        [attr.data-test]="'option-' + id"
        name="reasonGroup"
        [value]="reason"
        [(ngModel)]="selectedReason"
        [inputId]="id"
      ></p-radioButton>
      <label
        class="khoji-sub-headings"
        [for]="id"
        >{{ reason }}</label
      >
      <input
        *ngIf="last"
        placeholder="Reason..."
        pInputText
        type="text"
        [(ngModel)]="otherReason"
        class="ml-2 w-full"
        (focus)="selectedReason = reasons[reasons.length - 1]"
      />
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button
      (click)="close()"
      [label]="translation?.userProfile.deleteAccount.cancelBtn"
      styleClass="p-button-text"
    ></p-button>
    <p-button
      data-test="confirm-deletion"
      (click)="deleteAccount()"
      [disabled]="!validReason()"
      [label]="translation?.userProfile.deleteAccount.deleteAccountBtn"
      styleClass="p-button-danger"
    ></p-button>
  </ng-template>
</p-dialog>
