<div>
  <h5 class="font-normal">{{translation?.userProfile.settings.emailSubscriptionLabel}}</h5>
  <form name="form" #f="ngForm">
    <p-checkbox data-test="subscription-checkbox" name="checkbox-2"
      label="{{translation?.userProfile.settings.emailSubscriptionCheckboxLabel}}" class="text-900 mb-4" inputId="id"
      [(ngModel)]="emailCheckbox" binary=[true] (onChange)="updateEmailWorklog($event)">
    </p-checkbox>

    <div class="mt-3 mb-5" *ngIf="emailCheckbox">
      <h5 class="font-normal">
        {{translation?.userProfile.settings.emailFrequencyLabel}}
        <khoji-tooltip-icon [toolTipType]="'custom'"
          [tooltipText]="translation?.userProfile.settings.emailFrequencyTooltip"
          [inheritColor]="true"></khoji-tooltip-icon>
      </h5>
      <div class="flex gap-8">
        <div *ngFor="let category of categories" class="align-items-center gap-1">
          <p-radioButton [inputId]="category.key" name="category" [value]="category" [(ngModel)]="selectedCategory"
            (click)="trackFrequency($event)"></p-radioButton>
          <label [for]="category.key" class="ml-2">{{ category.name }}</label>
        </div>
      </div>
    </div>

    <div>
      <button data-test="submit-button" pButton pRipple type='submit' (click)="onSubmit()" [disabled]="disableButton()">
        {{translation?.userProfile.settings.updateSettingsButtonText}}
      </button>
    </div>
  </form>
</div>
