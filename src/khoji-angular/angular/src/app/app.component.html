  (onClose)="handleMessageServiceCount(constants.NETWORK_COUNT)"></p-toast>
<p-toast key="warning" position="top-center" baseZIndex="1051" data-test="toast-message-warning"
  (onClose)="handleMessageServiceCount(constants.WARNING_COUNT)"></p-toast>

<p-toast key="message" position="top-center" baseZIndex="1051" data-test="toast-message"></p-toast>
